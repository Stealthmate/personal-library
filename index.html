<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <title>Val's Library</title>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Vuetify -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vuetify@3.12.5/dist/vuetify.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.12.5/dist/vuetify.min.js"></script>

    <!-- Load d3.js -->
    <script src="https://d3js.org/d3.v4.min.js"></script>

    <!-- Load the sankey.js function -->
    <script src="https://unpkg.com/d3-array@1"></script>
    <script src="https://unpkg.com/d3-collection@1"></script>
    <script src="https://unpkg.com/d3-path@1"></script>
    <script src="https://unpkg.com/d3-shape@1"></script>
    <script src="https://unpkg.com/d3-sankey@0"></script>

    <style>
        .v-chip[disabled].selectable {
            color: #FFAAAA;
        }
        .v-chip.selectable {
            opacity: 0.7;
            color: #0055AA;
        }
        .v-chip.selectable.selected {
            opacity: 1.0;
        }
        .link {
            fill: none;
            stroke: #000;
            stroke-opacity: .2;
        }
        .link:hover {
            stroke-opacity: .5;
        }
    </style>
</head>

<body>
    <script type="text/x-template" id="app-template">
        <v-app>
            <v-app-bar>
                <v-app-bar-title>Val's Library</v-app-bar-title>
            </v-app-bar>
            <v-main>
                <v-container>
                    <section ref="sankey" class="d-flex flex-column align-center"></section>
                    <section>
                        <v-card flat>
                            <v-card-text class="d-flex flex-column">
                                <v-container fluid>
                                    <v-row>
                                        <v-checkbox v-model="selectedFiction" density="comfortable" label="Fiction" hide-details></v-checkbox>
                                        <v-text-field class="ml-5" v-model="query" variant="underlined" placeholder="Search..." />
                                    </v-row>
                                </v-container>
                                <div>
                                    <span>Field</span>
                                    <v-chip-group v-model="selectedCat1" filter column>
                                        <v-chip v-for="v in cat1Values" class="selectable" :value="v" selected-class="selected" :disabled="activeCat1Values.indexOf(v) === -1">{{ v }}</v-chip>
                                    </v-chip-group>
                                </div>
                                <div>
                                    <span>Sub-field</span>
                                    <v-chip-group v-model="selectedCat2" filter column>
                                        <v-chip v-for="v in cat2Values" class="selectable" :value="v" selected-class="selected" :disabled="activeCat2Values.indexOf(v) === -1">{{ v }}</v-chip>
                                    </v-chip-group>
                                </div>
                                <div>
                                    <span>Tag</span>
                                    <v-chip-group v-model="selectedTags" filter multiple column>
                                        <v-chip v-for="v in tagValues" class="selectable" :value="v" selected-class="selected" :disabled="activeTagValues.indexOf(v) === -1">{{ v }}</v-chip>
                                    </v-chip-group>
                                </div>
                                <v-chip-group v-model="selectedLanguages" filter multiple column>
                                    <v-chip v-for="language in theLanguages" class="selectable chip-language" :value="language" selected-class="selected">{{ language }}</v-chip>
                                </v-chip-group>
                            </v-card-text>
                        </v-card>
                    </section>
                    <section v-for="resource in filteredResources" class="mt-5">
                        <v-card>
                            <v-card-item>
                                <v-card-title class="d-flex flex-column align-start">
                                    <span>{{ resource.title }}</span>
                                    <span class="text-subtitle-2">{{ resource.subtitle }}</span>
                                </v-card-title>
                                <v-card-subtitle>
                                    <span>{{ resource.authors.join(', ') }}</span>
                                </v-card-subtitle>
                            </v-card-item>
                            <v-card-text class="d-flex flex-column align-start">
                                <div class="font-italic">{{ resource.review }}</div>
                                <div class="d-flex flex-row justify-space-between align-center w-100">
                                    <div class="mt-3 text-body-small opacity-40">
                                        {{ resource.cat1 }}, {{ resource.cat2 }}
                                    </div>
                                    <div class="mt-3 ">
                                        <v-chip class="chip-language">{{ resource.language }}</v-chip>
                                        <v-chip v-for="tag in resource.tags">{{ tag }}</v-chip>
                                    </div>
                                </div>
                            </v-card-text>
                        </v-card>
                    </section>
                </v-container>
            </v-main>
        </v-app>
    </script>
    <script type="module">
        const { createApp, ref } = Vue;
        const { createVuetify } = Vuetify;
        import DATA from './data.json' with { type: "json" };
        import sankey from './sankey.js';

        createApp({
            template: '#app-template',
            data() {
                return {
                    resources: DATA.map(e => {
                        let r = {
                            ...e,
                            tags: (e.tags || []),
                            subtitle: (e.subtitle || ""),
                            authors: (e.authors || [])
                        };
                        return r;
                    }),
                    selectedFiction: false,
                    query: '',
                    selectedCat1: undefined,
                    selectedCat2: undefined,
                    selectedTags: [],
                    selectedLanguages: [],
                };
            },
            mounted() {
                sankey.draw(this.$refs.sankey);
            },
            computed: {
                cat1Values() {
                    return [...new Set(this.resources.map(book => book.cat1))];
                },
                activeCat1Values() {
                    return [...new Set(this.filterResources("cat1").map(book => book.cat1))];
                },
                cat2Values() {
                    return [...new Set(this.resources.map(book => book.cat2))];
                },
                activeCat2Values() {
                    return [...new Set(this.filterResources("cat2").map(book => book.cat2))];
                },
                tagValues() {
                    let tags = new Set();
                    this.resources.forEach(r => {
                        r.tags.forEach(t => tags.add(t));
                    });
                    return Array.from(tags);
                },
                activeTagValues() {
                    let tags = new Set();
                    this.filterResources(undefined).forEach(r => {
                        r.tags.forEach(t => tags.add(t));
                    });
                    return Array.from(tags);
                },
                theLanguages() {
                    return this.setOfValues('language');
                },
                filteredResources() {
                    return this.filterResources(undefined);
                }
            },
            methods: {
                setOfValues(field) {
                    let values = new Set();
                    this.resources.forEach(r => {
                        if(r[field]) {
                            values.add(r[field])
                        }
                    });
                    return Array.from(values);
                },
                filterResources(exclude) {
                    let results = this.resources;

                    if(exclude !== "fiction" && this.selectedFiction) {
                        results = results.filter(r => r.fiction);
                    }
                    if(exclude !== "query" && this.query !== '') {
                        let q = this.query.toLowerCase();
                        results = results.filter(r => {
                            return [
                                r.title.toLowerCase().includes(q),
                                r.subtitle.toLowerCase().includes(q)
                            ].some(x => x);
                        });
                    }
                    if(exclude !== "cat1" && this.selectedCat1 !== undefined) {
                        results = results.filter(r => r.cat1 === this.selectedCat1);
                    }
                    if(exclude !== "cat2" && this.selectedCat2 !== undefined) {
                        results = results.filter(r => r.cat2 === this.selectedCat2);
                    }
                    if(exclude !== "tag" && this.selectedTags.length > 0) {
                        results = results.filter(r => this.selectedTags.every(t => r.tags.indexOf(t) !== -1));
                    }

                    return results;
                }
            }
        }).use(createVuetify()).mount('#app');
    </script>
    <div id="app" />
</body>

</html>
